name: Comprobar orden EPEC

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener publicaciones
        run: |
          npx --yes xactions tweets EpecOficial --limit 50 > tweets-output.txt

      - name: Mostrar fechas de las publicaciones
        run: |
          node <<'NODE'
          const fs = require('fs');

          const output = fs.readFileSync('tweets-output.txt', 'utf8');

          const start = output.lastIndexOf('\n[');
          const jsonText = start >= 0
            ? output.slice(start + 1).trim()
            : output.slice(output.indexOf('[')).trim();

          const tweets = JSON.parse(jsonText);

          tweets.sort((a, b) =>
            Number(b.timestamp || 0) - Number(a.timestamp || 0)
          );

          console.log('');
          console.log('==========================================');
          console.log('PUBLICACIONES DE EPEC ORDENADAS POR FECHA');
          console.log('==========================================');
          console.log('');

          for (const tweet of tweets) {
            const date = tweet.timeParsed || 'SIN FECHA';
            const text = String(tweet.fullText || tweet.text || '')
              .replace(/\n/g, ' ');

            console.log(`${date} | ${tweet.id} | ${text.substring(0, 120)}`);
          }

          console.log('');
          console.log(`Total de publicaciones recibidas: ${tweets.length}`);
          NODE
