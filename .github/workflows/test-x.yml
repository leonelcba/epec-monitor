name: Probar EPEC

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Consultar EPEC
        run: |
          npx --yes xactions tweets EpecOficial --limit 5
