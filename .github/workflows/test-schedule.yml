name: Prueba Scheduler

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Confirmar ejecución automática
        run: |
          echo "=========================================="
          echo "PRUEBA DEL SCHEDULER DE GITHUB"
          echo "=========================================="
          echo ""
          echo "Hora UTC:"
          date -u
          echo ""
          echo "Evento:"
          echo "${{ github.event_name }}"
          echo ""
          echo "=========================================="
